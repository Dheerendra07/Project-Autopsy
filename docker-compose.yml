services:

  postgres:
    image: postgres:17
    container_name: project-autopsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_autopsy
      POSTGRES_USER: autopsy
      POSTGRES_PASSWORD: autopsy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - autopsy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopsy -d project_autopsy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: project-autopsy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autopsy_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autopsy_postgres_data:
  autopsy_redis_data:
