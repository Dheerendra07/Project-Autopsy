name: production-smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Hosted Project Autopsy URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOPSY_PRODUCTION_URL: ${{ inputs.url }}
      AUTOPSY_BOOTSTRAP_EMAIL: ${{ secrets.AUTOPSY_BOOTSTRAP_EMAIL }}
      AUTOPSY_BOOTSTRAP_PASSWORD: ${{ secrets.AUTOPSY_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Validate production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTOPSY_BOOTSTRAP_EMAIL"
          test -n "$AUTOPSY_BOOTSTRAP_PASSWORD"
          test "${#AUTOPSY_BOOTSTRAP_PASSWORD}" -ge 12

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run production smoke
        run: node scripts/production-smoke.mjs
