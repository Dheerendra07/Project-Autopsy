name: production-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/production-smoke.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Hosted Project Autopsy URL"
        required: false
        default: "https://project-autopsy.onrender.com"
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AUTOPSY_PRODUCTION_URL: ${{ inputs.url || 'https://project-autopsy.onrender.com' }}
      AUTOPSY_BOOTSTRAP_EMAIL: ${{ secrets.AUTOPSY_BOOTSTRAP_EMAIL || vars.AUTOPSY_BOOTSTRAP_EMAIL }}
      AUTOPSY_BOOTSTRAP_PASSWORD: ${{ secrets.AUTOPSY_BOOTSTRAP_PASSWORD || vars.AUTOPSY_BOOTSTRAP_PASSWORD }}
      AI_API_KEY: ${{ secrets.AI_API_KEY || vars.AI_API_KEY }}
      AUTOPSY_EXPECTED_AI_PROVIDER: gemini
      AUTOPSY_EXPECTED_AI_MODEL: gemini-3.8-flash
      AUTOPSY_EXPECTED_AI_FALLBACK_MODEL: gemini-3.7-flash
    steps:
      - name: Validate production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTOPSY_BOOTSTRAP_EMAIL"
          test -n "$AUTOPSY_BOOTSTRAP_PASSWORD"
          test "${#AUTOPSY_BOOTSTRAP_PASSWORD}" -ge 12

      - name: Validate AI provider credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AI_API_KEY"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run production smoke
        run: node scripts/production-smoke.mjs
