name: runner-probe

on:
  push:
    branches:
      - probe/runner-availability-2026-10-01

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
