name: quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  typecheck-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: project_autopsy
          POSTGRES_USER: autopsy
          POSTGRES_PASSWORD: autopsy_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autopsy -d project_autopsy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://autopsy:autopsy_dev_password@127.0.0.1:5432/project_autopsy
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REPOSITORY_STORAGE_PATH: ./storage/repositories
      MAX_REPOSITORY_SIZE_MB: 500
      MAX_ANALYSIS_TIME_MINUTES: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Verify migrations are idempotent
        run: npm run db:migrate

      - name: Server startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          node dist/server.js > server-smoke.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready_ok=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ready > readiness.json; then
              ready_ok=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready_ok" != "true" ]; then
            cat server-smoke.log
            exit 1
          fi

          cat readiness.json

          kill -TERM "$server_pid"

          wait "$server_pid" || {
            status=$?
            cat server-smoke.log
            exit "$status"
          }

          trap - EXIT
          cat server-smoke.log

      - name: Worker startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          node dist/workers/analysis.worker.js > worker-smoke.log 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 8); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat worker-smoke.log
              exit 1
            fi
            sleep 1
          done

          kill -TERM "$worker_pid"

          wait "$worker_pid" || {
            status=$?
            cat worker-smoke.log
            exit "$status"
          }

          trap - EXIT
          cat worker-smoke.log
