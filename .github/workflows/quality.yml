name: quality

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      NODE_ENV: test
      PORT: 5000
    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          node --version
          npm --version
      - name: Runner execution probe
        run: node -e "console.log('Project Autopsy runner probe reached step execution.')"
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: End-to-end import analysis report acceptance
        run: AUTOPSY_E2E=1 npx tsx --test tests/e2e.import-analysis-report.test.ts

      - name: Verify migrations are idempotent
        run: npm run db:migrate

      - name: Server startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          node dist/server.js > server-smoke.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready_ok=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ready > readiness.json; then
              ready_ok=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready_ok" != "true" ]; then
            cat server-smoke.log
            exit 1
          fi

          cat readiness.json

          kill -TERM "$server_pid"

          wait "$server_pid" || {
            status=$?
            cat server-smoke.log
            exit "$status"
          }

          trap - EXIT
          cat server-smoke.log

      - name: Combined API and worker startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          node dist/free-runtime.js > combined-runtime-smoke.log 2>&1 &
          runtime_pid=$!

          cleanup() {
            kill "$runtime_pid" 2>/dev/null || true
            wait "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready_ok=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health > health.json; then
              ready_ok=true
              break
            fi

            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat combined-runtime-smoke.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready_ok" != "true" ]; then
            cat combined-runtime-smoke.log
            exit 1
          fi

          cat health.json

          kill -TERM "$runtime_pid"

          wait "$runtime_pid" || {
            status=$?
            cat combined-runtime-smoke.log
            exit "$status"
          }

          trap - EXIT
          cat combined-runtime-smoke.log

      - name: Worker startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          node dist/workers/analysis.worker.js > worker-smoke.log 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 8); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat worker-smoke.log
              exit 1
            fi
            sleep 1
          done

          kill -TERM "$worker_pid"

          wait "$worker_pid" || {
            status=$?
            cat worker-smoke.log
            exit "$status"
          }

          trap - EXIT
          cat worker-smoke.log
