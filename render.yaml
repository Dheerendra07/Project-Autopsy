services:
  - type: web
    name: project-autopsy
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/database/migrate.js && node dist/free-runtime.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTOPSY_SERVICE_ROLE
        value: web
      - key: PORT
        value: "10000"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REPOSITORY_STORAGE_PATH
        value: ./storage/repositories
      - key: MAX_REPOSITORY_SIZE_MB
        value: "500"
      - key: MAX_ANALYSIS_TIME_MINUTES
        value: "30"
      - key: MAX_ANALYZED_COMMITS
        value: "25000"
      - key: EVIDENCE_RETENTION_DAYS
        value: "365"
      - key: RUNTIME_TELEMETRY_INGEST_KEY
        sync: false
      - key: DEPLOYMENT_EVIDENCE_INGEST_KEY
        sync: false
      - key: AUTOPSY_BOOTSTRAP_EMAIL
        sync: false
      - key: AUTOPSY_BOOTSTRAP_PASSWORD
        sync: false
      # Temporary compatibility secret used only by the one-time legacy workspace migration.
      - key: AUTOPSY_API_ACCESS_KEY
        sync: false
      # Transactional auth email is opt-in until a verified Brevo sender/domain is configured.
      - key: BREVO_API_KEY
        sync: false
      - key: AUTOPSY_EMAIL_FROM
        sync: false
      - key: AUTOPSY_EMAIL_FROM_NAME
        value: Project Autopsy
      - key: AUTOPSY_PUBLIC_URL
        sync: false
      - key: REPOSITORY_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_FALLBACK_MODEL
        value: gemini-3.7-flash
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AUTOPSY_CORS_ORIGINS
        value: "https://project-autopsy.onrender.com,https://project-autopsy-ui.onrender.com"
