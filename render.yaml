services:
  - type: web
    name: project-autopsy
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/database/migrate.js && node dist/free-runtime.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTOPSY_SERVICE_ROLE
        value: web
      - key: PORT
        value: "10000"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REPOSITORY_STORAGE_PATH
        value: ./storage/repositories
      - key: MAX_REPOSITORY_SIZE_MB
        value: "500"
      - key: MAX_ANALYSIS_TIME_MINUTES
        value: "30"
      - key: MAX_ANALYZED_COMMITS
        value: "25000"
      - key: EVIDENCE_RETENTION_DAYS
        value: "365"
      - key: RUNTIME_TELEMETRY_INGEST_KEY
        sync: false
      - key: DEPLOYMENT_EVIDENCE_INGEST_KEY
        sync: false
      - key: AUTOPSY_API_ACCESS_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_INTERPRETATION_ACCESS_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-5.6-luna
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AUTOPSY_CORS_ORIGINS
        sync: false
